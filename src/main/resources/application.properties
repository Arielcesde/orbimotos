spring.application.name=orbimotos

# Conexión a la Base de Datos mediante variables de entorno (.env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto de base de datos (Spring Boot 3+ lo detecta automáticamente, pero es válido dejarlo explícito)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Puerto del servidor (Usa la variable PORT si existe, o 8080 por defecto)
server.port=${PORT:8080}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Formato de respuesta de error limpia
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false